name: Family validation
on:
  pull_request:
  push:
    branches: [main, 'fix/v2-release-validation-*']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-family.txt
      - run: python -m pip install -r requirements-family.txt
      - name: Verify preserved legacy assets
        run: |
          python verify.py
          python verify_ttf.py
      - name: Full current-source and artifact validation
        run: python verify_family.py --report build/v2-ci/full-tests.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-validation-${{ matrix.os }}
          path: build/v2-ci/
          if-no-files-found: warn
